spring.application.name=presentya-api
server.port=${PORT:8080}

# Banco de dados PostgreSQL: BDPresentya
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/BDPresentya}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

# Cria/atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Upload de fotos (até 5 MB, conferido no CatalogoService) e vídeos das ofertas (até 25 MB)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Base brasileira de códigos de barras (cosmos.bluesoft.com.br): opcional, melhora a leitura de produtos nacionais
app.cosmos.token=${COSMOS_TOKEN:}

# Robô de ofertas no Telegram (gratuito): token do @BotFather. Vazio = desligado.
app.telegram.token=${TELEGRAM_BOT_TOKEN:}

# Robô de ofertas no WhatsApp (WhatsApp Cloud API da Meta). Vazio = desligado.
app.whatsapp.token=${WHATSAPP_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
# Número da API (com 55 e DDD), se for diferente do WhatsApp em "Dados da loja"
app.whatsapp.numero=${WHATSAPP_NUMERO:}
# Modelo aprovado na Meta para ofertas a quem não falou com a loja nas últimas 24 h (variável {{1}} = título)
app.whatsapp.modelo=${WHATSAPP_MODELO:}
app.whatsapp.modelo-idioma=${WHATSAPP_MODELO_IDIOMA:pt_BR}
app.whatsapp.versao=${WHATSAPP_API_VERSAO:v23.0}

# Segurança (troque JWT_SECRET em produção: mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:troque-este-segredo-de-desenvolvimento-presentya-2026}
app.jwt.expiracao-horas=8

# Endereços: frontend (vírgula para vários) e a própria API (para o webhook do Mercado Pago)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.api-url=${API_URL:http://localhost:8080}

# Primeiro administrador (criado só quando não existe nenhum usuário)
app.admin.email=${ADMIN_EMAIL:admin@presentya.com.br}
app.admin.senha=${ADMIN_PASSWORD:Admin@2026}

# Mercado Pago: vazio = modo simulado (sem cobrança real)
pagamento.mercadopago.access-token=${MP_ACCESS_TOKEN:}
