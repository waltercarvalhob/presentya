spring.application.name=presentya-api
server.port=${PORT:8080}

# Banco de dados PostgreSQL: BDPresentya
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/BDPresentya}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

# Cria/atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Upload de fotos dos produtos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Segurança (troque JWT_SECRET em produção: mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:troque-este-segredo-de-desenvolvimento-presentya-2026}
app.jwt.expiracao-horas=8

# Endereços: frontend (vírgula para vários) e a própria API (para o webhook do Mercado Pago)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.api-url=${API_URL:http://localhost:8080}

# Primeiro administrador (criado só quando não existe nenhum usuário)
app.admin.email=${ADMIN_EMAIL:admin@presentya.com.br}
app.admin.senha=${ADMIN_PASSWORD:Admin@2026}

# Mercado Pago: vazio = modo simulado (sem cobrança real)
pagamento.mercadopago.access-token=${MP_ACCESS_TOKEN:}
