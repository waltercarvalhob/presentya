# Hospedagem da loja (frontend) no Netlify: Add new site > Import from Git > este repositório.
# O Netlify lê este arquivo sozinho: não precisa preencher pasta, comando nem pasta de publicação.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Aplicativo de página única: qualquer endereço (/ofertas, /admin/nfc…) abre o index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# O service worker (notificações do app) precisa ser sempre a versão mais nova.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
